[package]
name = "midi-arpeggiator"
version = "0.2.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["unix"]
unix = ["dep:nonblock"]
text = []
led = ["dep:ws281x-rpi", "dep:smart-leds"]

[dependencies]
wmidi = "4.0.6"
strum = "0.24.1"
strum_macros = "0.24.1"
nonblock = { version = "0.2.0", optional = true }
serde_json = "1.0.91"
serde = "1.0.152"
serde_derive = "1.0.152"
smart-leds = { version = "0.3.0", optional = true }
ws281x-rpi = { version = "0.0.1", optional = true }
